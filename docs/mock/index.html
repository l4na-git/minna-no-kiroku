<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなのきろく モック</title>
<style>
  /*
    配色・寸法は、デジタル庁デザインシステムの基準(本文16px以上・行間1.5倍以上・太さ400/700・
    テキスト4.5:1・枠線3:1)と、iOS系アプリの「グレーの背景に白いカード」の型に合わせている。
  */
  :root {
    --bg: #f3f6f5;
    --surface: #ffffff;
    --text: #1c1c1e;
    --muted: #5c5c63;
    --line: #e0e0e5;          /* 飾りの区切り線(これだけでは何かを伝えない線) */
    --line-strong: #8e8e93;   /* 入力欄などの枠。背景との比 3:1 以上 */
    --accent: #0f766e;
    --accent-text: #ffffff;
    --danger: #b3261e;
    /* 書いた人ごとの色(塗りと文字)。誰が書いたかを示すためだけに使う */
    --m1-bg: #0e7490; --m1-fg: #ffffff;
    --m2-bg: #b45309; --m2-fg: #ffffff;
    --m3-bg: #6d28d9; --m3-fg: #ffffff;
    --m4-bg: #475569; --m4-fg: #ffffff;
    --m5-bg: #1d4ed8; --m5-fg: #ffffff;
    --m6-bg: #4d7c0f; --m6-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f10; --surface: #1c1c1e; --text: #f2f2f7; --muted: #a8a8b0;
      --line: #38383a; --line-strong: #8e8e93; --accent: #5fd0c3; --accent-text: #04201c;
      --danger: #ff8a80;
      --m1-bg: #67d4e8; --m1-fg: #04202a;
      --m2-bg: #f5b361; --m2-fg: #2a1700;
      --m3-bg: #b9a2f5; --m3-fg: #1c0b44;
      --m4-bg: #b6c2d1; --m4-fg: #111a26;
      --m5-bg: #8fb4ff; --m5-fg: #06173d;
      --m6-bg: #a8d36a; --m6-fg: #172400;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f10; --surface: #1c1c1e; --text: #f2f2f7; --muted: #a8a8b0;
    --line: #38383a; --line-strong: #8e8e93; --accent: #5fd0c3; --accent-text: #04201c;
    --danger: #ff8a80;
    --m1-bg: #67d4e8; --m1-fg: #04202a;
    --m2-bg: #f5b361; --m2-fg: #2a1700;
    --m3-bg: #b9a2f5; --m3-fg: #1c0b44;
    --m4-bg: #b6c2d1; --m4-fg: #111a26;
    --m5-bg: #8fb4ff; --m5-fg: #06173d;
    --m6-bg: #a8d36a; --m6-fg: #172400;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 1.0625rem;   /* 17px。端末の文字サイズ設定に追従する */
    line-height: 1.7;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  b, h1, h2, h3 { font-weight: 700; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 押せる部分は 44px 以上にする */
  .btn, .link, .rowbtn, .presets button, .entrybtn, .navrow {
    min-height: 44px; display: inline-flex; align-items: center; cursor: pointer;
  }
  .btn {
    justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 10px; font-weight: 700;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.small { min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: .9375rem; white-space: nowrap; }
  .btn.block { width: 100%; }
  .btn.secondary { background: var(--surface); color: var(--accent); }
  .btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
  .btn.danger-fill { background: var(--danger); border-color: var(--danger); color: #fff; }
  .link { background: none; border: 0; padding: 0 8px; color: var(--accent); }
  .link.danger { color: var(--danger); }
  .link.strong { font-weight: 700; padding: 0 12px; }
  /* 削除は、主な操作から離した別枠に置く */
  .card + .card.apart { margin-top: 48px; }
  .navrow.dangerrow { justify-content: center; min-height: 52px; color: var(--danger); font-weight: 700; }
  .stack { display: grid; gap: 12px; }

  /* モックの操作(実際のアプリにはない部分) */
  .mockbar { background: var(--bg); padding: 10px 12px 4px; border-bottom: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chips button {
    min-height: 40px; padding: 0 12px; cursor: pointer; font-size: .875rem; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .mockbar details { max-width: 420px; margin: 8px auto 6px; font-size: .875rem; }
  .mockbar summary { cursor: pointer; color: var(--muted); min-height: 32px; }
  .mockbar label { display: grid; grid-template-columns: 9em 1fr; align-items: center; gap: 8px; margin: 6px 0; }
  .mockbar select { min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 8px; }

  .phone { max-width: 420px; margin: 0 auto; background: var(--bg); min-height: 80vh; }
  .screen { display: flex; flex-direction: column; min-height: 80vh; }
  header.bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px;
    min-height: 56px; padding: 6px 8px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 1;
  }
  header.bar .title { font-weight: 700; text-align: center; white-space: nowrap; display: flex; flex-direction: column; line-height: 1.3; }
  header.bar .title small { font-weight: 400; color: var(--muted); font-size: .875rem; }
  header.bar > :first-child { justify-self: start; }
  header.bar > :last-child { justify-self: end; }
  .body { padding: 16px; flex: 1; }
  .footbar {
    position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .footbar .btn { white-space: nowrap; }
  .body.has-fab { padding-bottom: 104px; }

  /* 下のタブバー(グループの中の3つの画面)。アイコンと文字ラベルを必ず並べる */
  .tabbar {
    position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: none; border: 0; cursor: pointer; color: var(--muted); font-size: .875rem;
  }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .tabbar svg { display: block; }
  /* 記録タブの右下に浮かぶ「記録する」ボタン */
  .fabwrap { position: fixed; z-index: 2; right: max(16px, calc((100vw - 420px) / 2 + 16px)); bottom: calc(77px + env(safe-area-inset-bottom)); }
  .fab {
    min-height: 56px; padding: 0 22px; border-radius: 16px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.28);
  }
  .lead { color: var(--muted); font-size: .9375rem; line-height: 1.6; margin: 0 0 12px; }
  .section-label { margin: 22px 4px 6px; color: var(--muted); font-size: .9375rem; font-weight: 700; }

  /* カード */
  .card { background: var(--surface); border-radius: 12px; overflow: hidden; }
  .card + .card { margin-top: 12px; }
  .card .pad { padding: 16px; }
  .navrow {
    width: 100%; min-height: 64px; justify-content: space-between; gap: 12px; padding: 10px 16px;
    background: none; border: 0; text-align: left;
  }
  .navrow + .navrow { border-top: 1px solid var(--line); }
  .navrow .sub { display: block; color: var(--muted); font-size: .9375rem; }
  .chev { flex: none; color: var(--muted); }
  .empty { text-align: center; padding: 28px 16px; }
  .empty p { margin: 0 0 16px; color: var(--muted); }

  /* 入力 */
  .field { display: block; margin-bottom: 8px; color: var(--muted); font-size: .9375rem; line-height: 1.6; }
  textarea.text, input.textfield {
    width: 100%; padding: 14px; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 10px;
  }
  textarea.text { min-height: 260px; resize: vertical; }
  input.textfield { min-height: 52px; padding: 0 14px; }
  textarea.text::placeholder, input.textfield::placeholder { color: var(--muted); }

  /* 日付ごとのまとまり: 日付は背景の上に小さく置き、記録は白いカードにまとめる */
  .day { margin-top: 20px; }
  .day:first-child { margin-top: 4px; }
  .day h3 { margin: 0 4px 6px; color: var(--muted); font-size: .9375rem; }
  .entries { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 12px; overflow: hidden; }
  .entries li + li { border-top: 1px solid var(--line); }
  .entry, .entrybtn { display: flex; gap: 12px; padding: 14px; width: 100%; text-align: left; background: none; border: 0; align-items: flex-start; }
  .m1 { --mb: var(--m1-bg); --mf: var(--m1-fg); }
  .m2 { --mb: var(--m2-bg); --mf: var(--m2-fg); }
  .m3 { --mb: var(--m3-bg); --mf: var(--m3-fg); }
  .m4 { --mb: var(--m4-bg); --mf: var(--m4-fg); }
  .m5 { --mb: var(--m5-bg); --mf: var(--m5-fg); }
  .m6 { --mb: var(--m6-bg); --mf: var(--m6-fg); }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--mb); color: var(--mf); font-weight: 700; font-size: 1rem; line-height: 1;
  }
  .avatar.lg { width: 44px; height: 44px; }
  .ebody { flex: 1; min-width: 0; }
  .ehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
  .ehead .name { font-weight: 700; }
  .ehead time { color: var(--muted); font-size: .9375rem; }
  .entry p, .entrybtn p { margin: 2px 0 0; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .edited { color: var(--muted); font-size: .875rem; }

  /* 記録の詳細 */
  .detail-date { font-weight: 700; margin: 0; }
  .detail-who { display: flex; align-items: center; gap: 10px; margin: 12px 0 16px; }
  .detail-body { margin: 0; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* メンバー */
  .member { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; }
  .member + .member { border-top: 1px solid var(--line); }
  .member .grow { flex: 1; }
  .member .role { color: var(--muted); font-size: .9375rem; }
  .member.former { opacity: .75; }
  .infolist { margin: 12px 0 0; padding-left: 1.2em; color: var(--muted); font-size: .9375rem; }
  .linkbox {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9375rem; word-break: break-all;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px;
  }
  .errorcard { border: 1px solid var(--line-strong); }

  /* 相談用ビュー */
  .rowbtn {
    width: 100%; min-height: 56px; gap: 12px; padding: 6px 14px; text-align: left;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  }
  .rowbtn .rl { font-weight: 700; }
  .rowbtn .rv { flex: 1; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.4; }
  .rowbtn .rv small { color: var(--muted); font-size: .875rem; }
  .listbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 2px; color: var(--muted); font-size: .9375rem; }
  /* 並び順の切り替え(2択のセグメント) */
  .seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button { min-height: 44px; padding: 0 14px; background: none; border: 0; cursor: pointer; font-size: .9375rem; color: var(--text); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  .kv { padding: 12px 16px; min-height: 64px; }
  .kv small { display: block; color: var(--muted); font-size: .875rem; line-height: 1.4; }

  /* シート・ダイアログ */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .backdrop.center { align-items: center; padding: 16px; }
  .sheet {
    width: 100%; max-width: 420px; max-height: 90vh; overflow: auto;
    background: var(--bg); color: var(--text);
    border-radius: 14px 14px 0 0; padding: 4px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .dialog { width: 100%; max-width: 360px; background: var(--surface); border-radius: 14px; padding: 20px 16px 16px; }
  .dialog h2 { margin: 0 0 8px; font-size: 1.0625rem; }
  .dialog p { margin: 0 0 14px; color: var(--muted); font-size: .9375rem; line-height: 1.65; }
  .dialog .actions { display: grid; gap: 10px; margin-top: 14px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
  .presets { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 12px; overflow: hidden; }
  .presets li + li { border-top: 1px solid var(--line); }
  .presets button, .choice {
    width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center;
    background: none; border: 0; padding: 0 14px; text-align: left; cursor: pointer;
  }
  .presets .check { color: var(--accent); font-weight: 700; visibility: hidden; }
  .presets button[aria-current="true"] .check { visibility: visible; }
  .choices { list-style: none; margin: 0 0 4px; padding: 0; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .choices li + li { border-top: 1px solid var(--line); }
  .choice { gap: 10px; justify-content: flex-start; }
  .choice input { width: 20px; height: 20px; accent-color: var(--accent); }
  .custom { margin-top: 16px; }
  .custom .row { display: grid; gap: 10px; margin: 8px 0 14px; }
  .custom label { display: grid; grid-template-columns: 4.5em 1fr; align-items: center; gap: 8px; }
  .custom input[type="date"] {
    min-width: 0; min-height: 48px; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 10px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    background: #2c2c2e; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: .9375rem; max-width: 90vw;
  }

  /* ヘッダーのグループ切り替え(「母のこと ⌄」)。タブの最初の画面には戻るボタンを置かない */
  .groupbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; max-width: 11em; padding: 0 8px; background: none; border: 0; cursor: pointer; font-weight: 700; color: var(--text); }
  .groupbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .groupbtn svg { flex: none; color: var(--muted); }
  /* 一覧の操作のカード(期間・並び順・印刷) */
  .navrow .rv { flex: 1; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.4; }
  .navrow .rv small { color: var(--muted); font-size: .875rem; }
  .navrow.static { cursor: default; }
  /* 動作を起こす行: 矢印は付けず、アクセント色の文字とアイコンで見せる */
  .navrow.action { justify-content: flex-start; color: var(--accent); }
  .navrow .down, .navrow > svg:last-child { color: var(--muted); }
  .summary { margin: 10px 4px 0; color: var(--muted); font-size: .9375rem; }
  .tools { margin: 24px auto 32px; max-width: 420px; padding: 0 16px; font-size: .875rem; color: var(--muted); }
  .print-title { display: none; }

  /* 印刷(A4)。ブラウザの印刷プレビューで確認する */
  @page {
    size: A4; margin: 18mm 16mm;
    @bottom-center { content: counter(page) " / " counter(pages); font-size: 9pt; color: #555; }
  }
  @media print {
    .mockbar, .tools, header.bar, .noprint, .footbar, .tabbar, .fabwrap, .toast, .backdrop { display: none !important; }
    body { background: #fff; color: #000; font-size: 11pt; line-height: 1.7; }
    .phone { max-width: none; margin: 0; background: #fff; min-height: 0; }
    .screen { min-height: 0; }
    .body { padding: 0; }
    .print-title { display: block; margin-bottom: 10mm; padding-bottom: 4mm; border-bottom: 1.5pt solid #000; }
    .print-title h1 { font-size: 16pt; margin: 0 0 2mm; }
    .print-title p { margin: 0; color: #222; font-size: 10.5pt; }
    .day { margin-top: 6mm; }
    .day h3 { margin: 0; padding: 1mm 0; color: #000; font-size: 11pt; border-bottom: 1pt solid #000; }
    .entries { background: none; border-radius: 0; overflow: visible; }
    .entry, .entrybtn { break-inside: avoid; padding: 3mm 0; }
    .clamp { display: block; overflow: visible; -webkit-line-clamp: unset; }
    .entries li + li { border-top: .5pt solid #999; }
    .avatar { background: none; color: #000; border: 1pt solid #444; width: 9mm; height: 9mm; font-size: 10pt; }
    .ehead time, .edited { color: #222; }
  }
</style>
</head>
<body>

<div class="mockbar">
  <nav class="chips" id="chips" aria-label="画面の切り替え(モック用)"></nav>
  <details>
    <summary>モックの操作</summary>
    <p style="margin:6px 0">記録の内容は、すべて架空のものです。</p>
    <label>ログイン中の人
      <select id="selMe">
        <option value="u1">ゆうき（作成者）</option>
        <option value="u2">あおい</option>
      </select>
    </label>
    <label>表示の状態
      <select id="selMode">
        <option value="normal">通常</option>
        <option value="nogroup">グループに未所属</option>
        <option value="noentry">記録が 0 件</option>
        <option value="badinvite">招待リンクが使えない</option>
      </select>
    </label>
  </details>
</div>

<main class="phone" id="app"></main>

<div class="backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-label="期間を選ぶ">
    <div class="sheet-head">
      <b>期間を選ぶ</b>
      <button class="link" type="button" id="closeSheet">閉じる</button>
    </div>
    <ul class="presets">
      <li><button type="button" data-preset="week">直近1週間<span class="check">✓</span></button></li>
      <li><button type="button" data-preset="month" aria-current="true">直近1か月<span class="check">✓</span></button></li>
      <li><button type="button" data-preset="quarter">直近3か月<span class="check">✓</span></button></li>
      <li><button type="button" data-preset="all">すべて<span class="check">✓</span></button></li>
    </ul>
    <div class="custom">
      <b>期間を指定する</b>
      <div class="row">
        <label>開始日<input type="date" id="fromDate" value="2026-09-05"></label>
        <label>終了日<input type="date" id="toDate" value="2026-10-05"></label>
      </div>
      <button class="btn block" type="button" id="applyCustom">この期間で表示する</button>
    </div>
  </div>
</div>

<div class="backdrop" id="groupSheet" hidden>
  <div class="sheet" role="dialog" aria-label="グループを選ぶ">
    <div class="sheet-head">
      <b>グループを選ぶ</b>
      <button class="link" type="button" id="closeGroups">閉じる</button>
    </div>
    <ul class="presets" id="groupList"></ul>
    <div class="stack" style="margin-top:14px">
      <button class="btn secondary block" type="button" id="newGroup">＋ 新しいグループ</button>
    </div>
    <p class="lead" style="margin:14px 4px 0">家族から招待リンクを受け取ったときは、そのリンクを開いてください。</p>
  </div>
</div>

<div class="backdrop center" id="dialogWrap" hidden><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  /* ---------- データ ---------- */
  const TODAY = new Date('2026-10-05T20:00:00');
  const members = {
    u1: { name: 'ゆうき', cls: 'm1', role: '作成者' },
    u2: { name: 'あおい', cls: 'm2' },
    u3: { name: 'ひなた', cls: 'm3' },
    u4: { name: 'けい',   cls: 'm4', former: true },
  };

    },
    copy: b => { (navigator.clipboard ? navigator.clipboard.writeText($('#linkText').textContent) : Promise.resolve()).catch(() => {}); b.textContent = 'コピーしました'; setTimeout(() => { b.textContent = 'コピーする'; }, 1800); },
    share: () => toast('共有メニューが開きます（モックでは動きません）'),
    revoke: () => { S.invite = 'revoked'; render(); },
    renew: () => { S.invite = 'active'; render(); },
  };

  $('#dialog').addEventListener('click', ev => {
    const d = ev.target.closest('[data-d]'); if (!d) return;
    const k = d.dataset.d;
    if (k === 'cancel') return closeDialog();
    if (k === 'del') { const i = entries.findIndex(e => e.id === S.detailId); if (i >= 0) entries.splice(i, 1); closeDialog(); toast('削除しました'); S.view = 'timeline'; S.stack.pop(); render(); }
    if (k === 'leave') {
      closeDialog(); toast('グループを抜けました');
      const i = groups.findIndex(g => g.id === S.group); if (i >= 0) groups.splice(i, 1);
      if (groups.length) { S.group = groups[0].id; entries = store[S.group]; } else { S.mode = 'nogroup'; $('#selMode').value = 'nogroup'; }
      S.fromTab = true; go(home(), { reset: true });
    }
  });
  $('#dialog').addEventListener('change', ev => { if (ev.target.name === 'next') { const b = $('[data-d="leave"]'); if (b) b.disabled = false; } });
  $('#dialogWrap').addEventListener('click', ev => { if (ev.target.id === 'dialogWrap') closeDialog(); });
  $('#closeGroups').addEventListener('click', () => { $('#groupSheet').hidden = true; });
  $('#groupSheet').addEventListener('click', e => { if (e.target.id === 'groupSheet') $('#groupSheet').hidden = true; });
  $('#newGroup').addEventListener('click', () => { $('#groupSheet').hidden = true; go('create'); });

  /* ---------- モックの操作 ---------- */
  $('#chips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-chip]'); if (!b) return;
    S.stack = []; S.fromTab = ['timeline', 'members', 'settings'].includes(b.dataset.chip); S.view = b.dataset.chip; render();
  });
  $('#selMe').addEventListener('change', e => { S.me = e.target.value; render(); });
  $('#selMode').addEventListener('change', e => { S.mode = e.target.value; if (S.mode === 'nogroup') S.view = 'welcome'; else if (S.view === 'welcome') S.view = 'timeline'; render(); });

  /* ---------- 期間の選択 ---------- */
  const sheet = $('#sheet');
  const back2 = (m, d) => { const x = new Date(TODAY); x.setHours(0, 0, 0, 0); if (m) x.setMonth(x.getMonth() - m); if (d) x.setDate(x.getDate() - d); return x; };
  const PRESETS = { week: ['直近1週間', () => back2(0, 7)], month: ['直近1か月', () => back2(1, 0)], quarter: ['直近3か月', () => back2(3, 0)], all: ['すべて', () => new Date('2000-01-01T00:00:00')] };
  const setPeriod = (name, from, to) => { S.period = { name, from: isoOf(from), to: isoOf(to) }; sheet.hidden = true; render(); };
  sheet.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    sheet.querySelectorAll('[data-preset]').forEach(x => x.removeAttribute('aria-current'));
    b.setAttribute('aria-current', 'true');
    const [name, from] = PRESETS[b.dataset.preset];
    const end = new Date(TODAY); end.setHours(0, 0, 0, 0);
    setPeriod(name, from(), end);
  }));
  $('#applyCustom').addEventListener('click', () => {
    const f = $('#fromDate').value, t = $('#toDate').value;
    if (!f || !t || f > t) return;
    sheet.querySelectorAll('[data-preset]').forEach(x => x.removeAttribute('aria-current'));
    setPeriod('指定した期間', new Date(f + 'T00:00:00'), new Date(t + 'T00:00:00'));
  });
  $('#closeSheet').addEventListener('click', () => { sheet.hidden = true; });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { sheet.hidden = true; $('#groupSheet').hidden = true; closeDialog(); } });

  render();
})();
</script>
</body>
</html>
